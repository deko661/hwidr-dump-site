<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HWIDR SDK Viewer - Loading...</title>
<style>
body{margin:0;background:#0a0a0a;color:#e0e0e0;font-family:Consolas,monospace;display:flex;align-items:center;justify-content:center;height:100vh}
.loader{text-align:center}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.status{font-size:12px;color:#999}
</style>
</head>
<body>
<div class="loader">
<div class="spinner"></div>
<div class="status" id="status">Loading...</div>
</div>
<script>
var nameData=[],funcData={},objData=[],sdkData={},sdkContent={},apexData=null,EMBEDDED_VERSIONS={};

var chunkUrls=['app.html?v=1791407426'];

document.getElementById('status').textContent='Loading data and page chunks...';

Promise.all([
  Promise.all([
fetch('data/versions.json?v=1791407426').then(r=>r.text()).then(t=>{EMBEDDED_VERSIONS=JSON.parse(t)}),
fetch('data/apexData.json?v=1791407426').then(r=>r.text()).then(t=>{apexData=JSON.parse(t)}),
fetch('data/funcData.json?v=1791407426').then(r=>r.text()).then(t=>{funcData=JSON.parse(t)}),
fetch('data/nameData.json?v=1791407426').then(r=>r.text()).then(t=>{nameData=JSON.parse(t)}),
fetch('data/objData.json?v=1791407426').then(r=>r.text()).then(t=>{objData=JSON.parse(t)}),
Promise.all([fetch('data/sdkContent.json.part0?v=1791407426').then(r=>r.text()),fetch('data/sdkContent.json.part1?v=1791407426').then(r=>r.text()),fetch('data/sdkContent.json.part2?v=1791407426').then(r=>r.text()),fetch('data/sdkContent.json.part3?v=1791407426').then(r=>r.text()),fetch('data/sdkContent.json.part4?v=1791407426').then(r=>r.text())]).then(parts=>{var o=parts[0].trim().charAt(0),c=o==='['?']':'}';sdkContent=JSON.parse(o+parts.map(p=>p.trim().slice(1,-1)).join(',')+c)}),
fetch('data/sdkData.json?v=1791407426').then(r=>r.text()).then(t=>{sdkData=JSON.parse(t)})
  ]),
  Promise.all(chunkUrls.map(function(u){return fetch(u).then(function(r){return r.text()})}))
]).then(function(results){
  var fullHtml=results[1].join('');
  var dataScript='<script>'
    +'var nameData='+JSON.stringify(nameData)+';'
    +'var funcData='+JSON.stringify(funcData)+';'
    +'var objData='+JSON.stringify(objData)+';'
    +'var sdkData='+JSON.stringify(sdkData)+';'
    +'var sdkContent='+JSON.stringify(sdkContent)+';'
    +'var apexData='+JSON.stringify(apexData)+';'
    +'var EMBEDDED_VERSIONS='+JSON.stringify(EMBEDDED_VERSIONS)+';'
    +'<\/script>';
  if(fullHtml.indexOf('</head>')!==-1){
    fullHtml=fullHtml.replace('</head>', dataScript+'</head>');
  }else{
    fullHtml=dataScript+fullHtml;
  }
  document.open();
  document.write(fullHtml);
  document.close();
}).catch(function(e){
  document.getElementById('status').textContent='Error: '+e.message;
  console.error(e);
});
</script>
</body>
</html>
